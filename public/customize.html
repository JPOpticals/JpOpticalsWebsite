<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Build your pair | JP</title>
    <meta name="description" content="Choose a JP frame and create a personalized lens combination with a live preview.">
    <link rel="icon" type="image/svg+xml" href="/jp-favicon.svg">
    <link rel="stylesheet" href="/jp-ui.css">
    <script defer src="/jp-ui.js"></script>
  </head>
  <body class="jp-customizer-page">
    <header class="jp-standalone-header">
      <div class="jp-standalone-header__inner">
        <a class="jp-standalone-logo" href="/" aria-label="JP home">JP</a>
        <nav class="jp-standalone-nav" aria-label="Main navigation">
          <a href="/shop?type_frame=Sunglasses">Sunglasses</a>
          <a href="/shop?type_frame=Optical">Optical</a>
          <a href="/customize" aria-current="page">Customize</a>
          <a href="/help/faq">Help</a>
          <a href="/about-us">About</a>
        </nav>
        <div class="jp-standalone-actions">
          <button type="button" aria-label="Login" class="jp-standalone-icon-button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </button>
          <button type="button" aria-label="Search" class="jp-standalone-icon-button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          </button>
          <a class="jp-standalone-icon-button" href="/cart" aria-label="Cart">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          </a>
        </div>
      </div>
    </header>

    <main class="jp-customizer-page__main">
      <div class="jp-customizer-page__back-row">
        <a class="jp-customizer-page__back" data-jp-customizer-back href="/shop">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
          <span>Back to eyewear</span>
        </a>
        <p class="jp-customizer-page__note">Your selections update the preview instantly</p>
      </div>
      <div data-jp-customizer-page></div>
    </main>

    <footer class="jp-customizer-page__footer">
      <p>JP eyewear, made personal.</p>
      <a href="/help/faq">Need help choosing? Visit help</a>
    </footer>
  </body>
</html>
